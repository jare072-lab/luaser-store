<title>Agitadores — anuncio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,400;6..96,1,400&family=Archivo:wght@400;500&display=swap">
<style>
  :root { --ink:#0B0C0E; --bone:#FAF9F6; --gold:#E8927A; --gold-b:#F5AF95; --gris:#9C9890;
    --display:"Bodoni Moda","Times New Roman",serif; --body:"Archivo","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:#16181C; color:var(--bone); font-family:var(--body);
    display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; }
  /* 1080 x 1350 exactos: es el feed 4:5 de Meta, así una grabación de pantalla de esta caja
     ya sale a medida, sin reencuadrar. El zoom de ajuste va en un envoltorio aparte para no
     tocar el tamaño real del lienzo. */
  #marco { position:relative; }
  #anuncio { position:relative; width:1080px; height:1350px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, #1C2027 0%, #101216 44%, #0B0C0E 100%);
    transform-origin:top left; }
  .grano { position:absolute; inset:0; opacity:.45;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px); }
  .hilo { position:absolute; left:0; top:26%; height:1px; width:0;
    background:linear-gradient(90deg, transparent, var(--gold-b), transparent); opacity:0; }
  /* El palo se desvanece antes del texto: el agitador es larguísimo y meterlo entero
     encogería el monograma, que es lo que vende. */
  .velo { position:absolute; left:0; right:0; top:600px; height:280px;
    background:linear-gradient(180deg, rgba(12,14,17,0), #0C0E11); }
  .velo2 { position:absolute; left:0; right:0; top:880px; bottom:0; background:#0C0E11; }
  #lienzo { position:absolute; left:0; top:0; width:1080px; height:1350px; }
  .etiqueta { position:absolute; left:0; right:0; top:44px; text-align:center; font-size:21px;
    font-weight:500; letter-spacing:.3em; text-transform:uppercase; color:var(--gris); opacity:0; }
  .pie { position:absolute; left:0; right:0; bottom:0; padding:0 80px 44px; text-align:center; }
  .marca { font-size:20px; font-weight:500; letter-spacing:.34em; text-transform:uppercase; color:var(--gold); margin:0; opacity:0; }
  .pie h1 { font-family:var(--display); font-weight:400; font-size:80px; line-height:1.06; margin:22px 0 0; opacity:0; }
  .pie h1 em { font-style:italic; color:var(--gold); }
  .precio { font-size:26px; color:#CFC9C1; margin:22px 0 0; opacity:0; }
  .cta { display:inline-block; margin:32px 0 0; padding:20px 42px; border:1px solid rgba(232,146,122,.5);
    font-size:24px; font-weight:500; opacity:0; }
  .barra { display:flex; gap:14px; align-items:center; font-size:13px; color:#8B8279; }
  .barra button { font:500 13px var(--body); letter-spacing:.1em; text-transform:uppercase;
    background:#0B0C0E; color:#DFDCD6; border:1px solid #2A2D33; padding:10px 16px; cursor:pointer; }
  .barra button:hover { border-color:var(--gold); color:var(--gold); }
</style>

  const filo = el("path", { d: G.unionMonograma, "fill-rule": "evenodd", fill: "none", stroke: "#F5AF95", "stroke-width": 0.42 }, gF);
  const largoFilo = filo.getTotalLength();
  filo.style.strokeDasharray = largoFilo;
  // El pack: dos filas de cinco, recortadas al monograma.
  const gPack = el("g", {}, svg);
  const pw = PW * K_PACK;
  const pack = [];
  for (let f = 0; f < 2; f++) for (let i = 0; i < 5; i++) {
    const g = el("g", { transform: `translate(${W/2 - pw/2 + (i-2)*pw*1.04} ${190 + f*290}) scale(${ESC*K_PACK})`, "clip-path": "url(#soloMono)" }, gPack);
    const p = el("path", { d: G.unionCompleta, "fill-rule": "evenodd", fill: "url(#ac2)" }, g);
    g.style.opacity = 0;
    pack.push({ g, p, orden: f * 5 + i });
  }

  const $ = (id) => document.getElementById(id);
  const hilo = $("hilo"), etiqueta = $("etiqueta"), marca = $("marca"), titular = $("titular"),
        precio = $("precio"), cta = $("cta"), reloj = $("reloj");
  const DUR = 10000;
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const tramo = (t, a, b) => clamp((t - a) / (b - a));
  const salida = (t) => 1 - Math.pow(1 - t, 3);
  const suave = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  function cuadro(t) {
    // 1 · el hilo cruza
    hilo.style.width = `${salida(tramo(t, 0, 850)) * 100}%`;
    hilo.style.opacity = t < 750 ? 1 : 1 - tramo(t, 750, 980);

    // 2 · las letras entran y se encabalgan
    const e2 = salida(tramo(t, 800, 2400));
    const enPack = t >= 6300;
    gL.style.opacity = enPack ? 0 : (t >= 780 ? 1 - tramo(t, 2400, 2680) : 0);
    letras[0].setAttribute("transform", `translate(${(1 - e2) * -26} 0)`);
    letras[2].setAttribute("transform", `translate(${(1 - e2) * 26} 0)`);
    letras[1].setAttribute("transform", `translate(0 ${(1 - e2) * -18})`);
    letras[1].style.opacity = tramo(t, 1300, 2200);

    // 3 · se sueldan y 4 · baja el palo
    const u3 = tramo(t, 2300, 3300);
    filo.style.opacity = u3 > 0 && u3 < 1 ? 1 : 0;
    filo.style.strokeDashoffset = largoFilo * (1 - u3);
    const u4 = tramo(t, 2900, 4300);
    cpRect.setAttribute("height", u3 > 0.15 ? 10 + suave(u4) * (G.lienzo.H + 10) : 0);
    gP.style.opacity = enPack ? 1 - tramo(t, 6300, 6700) : 1;

    // 5 · cambia el acabado
    const i = t < 4500 ? 0 : Math.min(3, Math.floor((t - 4500) / 460) % 4);
    soldada.setAttribute("fill", `url(#ac${i})`);
    etiqueta.textContent = ACABADOS[i].n;
    etiqueta.style.opacity = tramo(t, 4300, 4700) * (1 - tramo(t, 6200, 6500));

    // 6 · el pack de diez
    pack.forEach(({ g, p }, k) => {
      const u = tramo(t, 6500 + k * 55, 7050 + k * 55);
      g.style.opacity = u;
      p.setAttribute("fill", `url(#ac${i})`);
    });
    if (t >= 6500 && t < 6900) etiqueta.textContent = "Pack de 10";
    if (t >= 6600) etiqueta.style.opacity = tramo(t, 6600, 6900);

    // 7 · el texto
    marca.style.opacity = tramo(t, 3600, 4200);
    titular.style.opacity = tramo(t, 7300, 8000);
    titular.style.transform = `translateY(${(1 - salida(tramo(t, 7300, 8000))) * 18}px)`;
    precio.style.opacity = tramo(t, 7900, 8500);
    cta.style.opacity = tramo(t, 8500, 9100);
    cta.style.transform = `translateY(${(1 - salida(tramo(t, 8500, 9100))) * 14}px)`;
  }

  let t0 = performance.now();
  const paso = (ahora) => {
    const t = (ahora - t0) % DUR;
    cuadro(t);
    reloj.textContent = (t / 1000).toFixed(1) + " s";
    requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
  $("rep").addEventListener("click", () => { t0 = performance.now(); });

  // Zoom sólo de ajuste a pantalla: el lienzo sigue midiendo 1080 x 1350 de verdad.
  const encajar = () => {
    const k = Math.min(1, (window.innerHeight - 110) / 1350, (window.innerWidth - 48) / 1080);
    const a = $("anuncio"), m = $("marco");
    a.style.transform = `scale(${k})`;
    m.style.width = `${1080 * k}px`;
    m.style.height = `${1350 * k}px`;
  };
  encajar();
  window.addEventListener("resize", encajar);
})();
</script>
